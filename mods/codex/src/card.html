<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginCue</title>
<style>
  /* Quiet, like the transcript around it. One mark of its own: the words Codex would decide carry a blue
     pencil's dotted underline (solid once they are yours), and a name the code lacks gets a squiggle. */
  :root {
    color-scheme: light;
    --line: rgba(13, 13, 13, 0.1);
    --ink: #0d0d0d;
    --ink-2: #5d5d5d;
    --ink-3: #6d6d6d;
    --pencil: #1a66c9;
    --pencil-wash: rgba(26, 102, 201, 0.1);
    --squiggle: #b45309;
    --squiggle-wash: rgba(180, 83, 9, 0.1);
    --wash: rgba(13, 13, 13, 0.05);
    --inset: #f7f7f7;
    --rule: rgba(13, 13, 13, 0.3);
    --go-bg: #0d0d0d;
    --go-ink: #ffffff;
    --menu: #ffffff;
    --menu-edge: 0 12px 32px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(13, 13, 13, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --line: rgba(255, 255, 255, 0.1); --ink: #ececec; --ink-2: #a8a8a8; --ink-3: #989898; --pencil: #7cb1ff;
      --pencil-wash: rgba(124, 177, 255, 0.14); --squiggle: #e3a54e; --squiggle-wash: rgba(227, 165, 78, 0.14);
      --wash: rgba(255, 255, 255, 0.06); --inset: rgba(255, 255, 255, 0.035); --rule: rgba(255, 255, 255, 0.28);
      --go-bg: #ececec; --go-ink: #0d0d0d; --menu: #303030;
      --menu-edge: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.09);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --line: rgba(255, 255, 255, 0.1); --ink: #ececec; --ink-2: #a8a8a8; --ink-3: #989898; --pencil: #7cb1ff;
    --pencil-wash: rgba(124, 177, 255, 0.14); --squiggle: #e3a54e; --squiggle-wash: rgba(227, 165, 78, 0.14);
    --wash: rgba(255, 255, 255, 0.06); --inset: rgba(255, 255, 255, 0.035); --rule: rgba(255, 255, 255, 0.28);
    --go-bg: #ececec; --go-ink: #0d0d0d; --menu: #303030;
    --menu-edge: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.09);
  }

  html, body { margin: 0; background: transparent; }
  body {
    font: 15px/1.7 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #card {
    position: relative;
    box-sizing: border-box;
    padding: 16px 20px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .reading { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; text-wrap: pretty; }
  .plan { margin: 0; text-wrap: pretty; }
  .row-note { font-size: 12px; color: var(--ink-2); }
  .sentence.arriving { animation: arrive 0.24s ease-out; }
  @keyframes arrive { from { opacity: 0; } }

  .mark {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    margin: 0 -3px;
    padding: 1px 3px;
    border-radius: 5px;
    cursor: pointer;
    text-align: inherit;
    text-decoration: underline dotted var(--pencil);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-color 0.15s ease;
  }
  .mark:hover, .mark[aria-expanded="true"] { background: var(--pencil-wash); }
  .mark.yours { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .mark.unknown, .name { text-decoration: underline wavy var(--squiggle); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
  .mark.unknown { color: var(--ink-2); font-style: italic; }
  .mark.unknown:hover, .mark.unknown[aria-expanded="true"] { background: var(--squiggle-wash); }
  .mark:focus-visible { outline: 2px solid var(--pencil); outline-offset: 1px; }
  .mark.changed { animation: changed 1s ease-out; }
  @keyframes changed { from { background: var(--pencil-wash); } to { background: transparent; } }

  .menu {
    position: absolute;
    z-index: 10;
    box-sizing: border-box;
    min-width: 240px;
    max-width: min(400px, calc(100% - 24px));
    max-height: 320px;
    overflow-y: auto;
    padding: 5px;
    background: var(--menu);
    border-radius: 12px;
    box-shadow: var(--menu-edge);
    outline: none;
    animation: open 0.12s ease-out;
  }
  @keyframes open { from { opacity: 0; transform: translateY(-3px); } }
  .option {
    display: grid;
    grid-template-columns: 16px 1fr;
    column-gap: 8px;
    padding: 6px 10px 6px 8px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
  }
  .option:hover, .option.active { background: var(--wash); }
  .option .tick { color: var(--pencil); font-weight: 600; }
  .option .hint { grid-column: 2; color: var(--ink-3); font-size: 12px; }
  .option.reset .text { color: var(--ink-2); }
  .divider { border-top: 1px solid var(--line); margin: 5px 6px; }
  .menu-note { padding: 6px 10px 3px 32px; color: var(--ink-3); font-size: 12px; }

  .preview { margin: 14px 0 0; padding: 10px 14px 14px; background: var(--inset); border-radius: 12px; }
  .preview-title { margin: 0 0 6px; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
  .preview.stale .preview-title::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 8px;
    border-radius: 50%;
    background: var(--pencil);
    vertical-align: 1px;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  @keyframes pulse { to { opacity: 0.25; } }
  .drawing {
    width: fit-content;
    max-width: 100%;
    margin: 4px auto 0;
    /* Tight enough for the box lines to meet from one row to the next. */
    font: 11.5px/1.22 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre;
    overflow-x: auto;
    transition: opacity 0.2s ease;
  }
  .drawing .rule { color: var(--rule); }
  .drawing .control { font-weight: 600; }
  .preview.stale .drawing { opacity: 0.4; }
  .drawing .skeleton { width: 520px; max-width: 100%; margin: 8px 0; }

  .actions { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .note {
    flex: 1;
    min-width: 0;
    height: 34px;
    box-sizing: border-box;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 14px;
  }
  .note::placeholder { color: var(--ink-3); }
  .note:focus { outline: none; border-color: var(--pencil); }
  .quiet, .go { height: 34px; font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
  .quiet { color: var(--ink-2); background: none; }
  .quiet:hover { color: var(--ink); background: var(--wash); }
  .go { font-weight: 600; color: var(--go-ink); background: var(--go-bg); padding: 0 18px; }
  .go:hover { opacity: 0.88; }
  .quiet:focus-visible, .go:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
  .quiet:disabled, .go:disabled, .note:disabled { opacity: 0.5; cursor: default; }
  .error { margin: 8px 0 0; font-size: 13px; color: var(--squiggle); }

  .summary { font-size: 14px; color: var(--ink-2); outline: none; }
  .summary-head { margin: 0; color: var(--ink); }
  .summary ul { margin: 6px 0 0; padding-left: 18px; }
  .summary-note { margin: 6px 0 0; }

  .skeleton, .skeleton-line::before, .pending {
    display: block;
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--wash) 25%, var(--line) 50%, var(--wash) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  .skeleton-line::before { content: ""; width: 62%; margin: 5px 0 6px; }
  .pending { display: inline-block; width: 120px; vertical-align: middle; margin-left: 4px; }
  .is-reading .plan:empty::before { content: ""; display: block; height: 12px; width: 88%; margin: 7px 0 10px; border-radius: 6px; background: var(--wash); }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .skeleton, .skeleton-line::before, .pending, .mark.changed, .sentence.arriving, .menu, .preview.stale .preview-title::after { animation: none; }
    .mark, .drawing { transition: none; }
  }
  @media (max-width: 480px) {
    #card { padding: 14px 16px; }
    .actions { flex-wrap: wrap; }
    .note { flex-basis: 100%; }
  }
</style>
</head>
<body>
  <article id="card" class="is-reading" aria-label="MarginCue">
    <p id="reading" class="reading skeleton-line" aria-live="polite"></p>
    <div id="editor">
      <p id="plan" class="plan" aria-live="polite"></p>
      <figure id="preview" class="preview" hidden>
        <figcaption id="preview-title" class="preview-title" role="status"></figcaption>
        <pre id="drawing" class="drawing" tabindex="0" aria-label="Preview"></pre>
      </figure>
      <form id="actions" class="actions">
        <input id="note" class="note" type="text" placeholder="Add a note for Codex" aria-label="Add a note for Codex" autocomplete="off">
        <button id="read" class="quiet" type="button" hidden>Read prompt</button>
        <button id="as-written" class="quiet" type="button">Use as written</button>
        <button id="go" class="go" type="submit">Go ahead</button>
      </form>
      <p id="send-error" class="error" role="alert" hidden></p>
    </div>
    <div id="summary" class="summary" role="status" tabindex="-1" hidden></div>
    <div id="menu" class="menu" role="listbox" hidden></div>
  </article>
  <!-- widget script -->
</body>
</html>
