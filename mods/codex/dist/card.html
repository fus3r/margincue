<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginCue</title>
<style>
  /* Quiet, like the transcript around it. One mark of its own: the words Codex would decide carry a blue

  :root {

    --squiggle-wash: rgba(180, 83, 9, 0.1);
    --wash: rgba(13, 13, 13, 0.05);
    --inset: #f7f7f7;
    --rule: rgba(13, 13, 13, 0.3);
    --go-bg: #0d0d0d;
    --go-ink: #ffffff;

      --pencil-wash: rgba(124, 177, 255, 0.14); --squiggle: #e3a54e; --squiggle-wash: rgba(227, 165, 78, 0.14);
      --wash: rgba(255, 255, 255, 0.06); --inset: rgba(255, 255, 255, 0.035); --rule: rgba(255, 255, 255, 0.28);
      --go-bg: #ececec; --go-ink: #0d0d0d; --menu: #303030;
      --menu-edge: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.09);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --line: rgba(255, 255, 255, 0.1); --ink: #ececec; --ink-2: #a8a8a8; --ink-3: #7a7a7a; --pencil: #7cb1ff;
    --pencil-wash: rgba(124, 177, 255, 0.14); --squiggle: #e3a54e; --squiggle-wash: rgba(227, 165, 78, 0.14);
    --wash: rgba(255, 255, 255, 0.06); --inset: rgba(255, 255, 255, 0.035); --rule: rgba(255, 255, 255, 0.28);
    --go-bg: #ececec; --go-ink: #0d0d0d; --menu: #303030;
    --menu-edge: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.09);
  }

  html, body { margin: 0; background: transparent; }

    color: var(--ink);

  }

    position: relative;
    box-sizing: border-box;
    padding: 16px 20px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;

  .plan { margin: 0; text-wrap: pretty; }
  .sentence.arriving { animation: arrive 0.24s ease-out; }

  .mark {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    margin: 0 -3px;
    padding: 1px 3px;
    border-radius: 5px;
    cursor: pointer;
    text-align: inherit;
    text-decoration: underline dotted var(--pencil);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-color 0.15s ease;

  .mark.unknown, .name { text-decoration: underline wavy var(--squiggle); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
  .mark.unknown { color: var(--ink-2); font-style: italic; }

  .actions { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .note {
    flex: 1;
    min-width: 0;
    height: 34px;
    box-sizing: border-box;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 14px;
  }
  .note::placeholder { color: var(--ink-3); }
  .note:focus { outline: none; border-color: var(--pencil); }
  .quiet, .go { height: 34px; font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
  .quiet { color: var(--ink-2); background: none; }
  .quiet:hover { color: var(--ink); background: var(--wash); }
  .go { font-weight: 600; color: var(--go-ink); background: var(--go-bg); padding: 0 18px; }
  .go:hover { opacity: 0.88; }
  .quiet:focus-visible, .go:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
  .quiet:disabled, .go:disabled, .note:disabled { opacity: 0.5; cursor: default; }
  .error { margin: 8px 0 0; font-size: 13px; color: var(--squiggle); }

  .summary { font-size: 14px; color: var(--ink-2); outline: none; }
  .summary-head { margin: 0; color: var(--ink); }
  .summary ul { margin: 6px 0 0; padding-left: 18px; }
  .summary-note { margin: 6px 0 0; }

  .skeleton, .skeleton-line::before, .pending {
    display: block;
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--wash) 25%, var(--line) 50%, var(--wash) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  .skeleton-line::before { content: ""; width: 62%; margin: 5px 0 6px; }
  .pending { display: inline-block; width: 120px; vertical-align: middle; margin-left: 4px; }
  .plan:empty::before { content: ""; display: block; height: 12px; width: 88%; margin: 7px 0 10px; border-radius: 6px; background: var(--wash); }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .skeleton, .skeleton-line::before, .pending, .mark.changed, .sentence.arriving, .menu, .preview.stale .preview-title::after { animation: none; }
    .mark, .drawing { transition: none; }
  }
  @media (max-width: 480px) {
    #card { padding: 14px 16px; }
    .actions { flex-wrap: wrap; }
    .note { flex-basis: 100%; }
  }
</style>
</head>

    const shown = picks[row.id] !== void 0 || !missingFor(row);
    row.options.forEach((option, index) => {
      const on = shown && selected(row).includes(index);
      const item = element("div", "option");
      item.id = `option-${row.id}-${index}`;
      item.setAttribute("role", "option");
      item.setAttribute("aria-selected", String(on));
      item.append(element("span", "tick", on ? "\u2713" : ""), element("span", "text", option));
      const assumed = !missingFor(row) && row.assumed.includes(index);
      const file = row.files?.[index];
      if (file || assumed) item.append(element("span", "hint", file ?? (many ? "Codex would include this" : "Codex would choose this")));
      item.addEventListener("click", (event) => {
        event.stopPropagation();
        choose(index);
      });
      items.push(item);
    });
    if (picks[row.id] !== void 0) {
      const reset = element("div", "option reset");
      reset.id = `option-${row.id}-reset`;
      reset.setAttribute("role", "option");
      reset.append(element("span", "tick", ""), element("span", "text", missingFor(row) ? "Leave it to Codex" : "Let Codex decide"));
      reset.addEventListener("click", (event) => {
        event.stopPropagation();
        choose(-1);
      });
      items.push(element("div", "divider"), reset);
    }
    if (many) items.push(element("div", "menu-note", "Pick any, then click outside."));
    menu.replaceChildren(...items);
  }
  function choose(index) {
    if (!open) return;
    const { row } = open;
    if (index < 0) delete picks[row.id];
    else if (row.type === "many") {
      const next = toggleSelection(row, selected(row), index);
      if (sameSelection(next, row.assumed)) delete picks[row.id];
      else picks[row.id] = next;
    } else if (!missingFor(row) && sameSelection([index], row.assumed)) delete picks[row.id];
    else picks[row.id] = [index];
    renderPlan();
    const anchor = plan.querySelector(`[data-row="${CSS.escape(row.id)}"]`);
    if (row.type === "many" && index >= 0 && anchor) {
      const active = menu.querySelector(".active")?.id;
      open = { row, anchor };
      renderMenu();
      place();
      activate(active ? menu.querySelector(`#${CSS.escape(active)}`) : null);
    } else {
      closeMenu();
      if (anchor) {
        anchor.classList.add("changed");
        anchor.focus({ preventScroll: true });
      }
    }
    schedulePreview(350);
  }
  function activate(item) {
    menu.querySelectorAll(".active").forEach((other) => other.classList.remove("active"));
    if (!item) return;
    item.classList.add("active");
    menu.setAttribute("aria-activedescendant", item.id);
    item.scrollIntoView({ block: "nearest" });
  }
  function closeMenu() {
    if (!open) return;
    open.anchor.setAttribute("aria-expanded", "false");
    open = null;
    menu.hidden = true;
    fit();
  }
  function place() {
    if (!open) return;
    const frame = root.getBoundingClientRect();
    const at = open.anchor.getBoundingClientRect();
    const left = Math.max(12, Math.min(at.left - frame.left - 8, frame.width - menu.offsetWidth - 12));
    menu.style.left = `${left}px`;
    menu.style.top = `${at.bottom - frame.top + 6}px`;
    fit();
  }
  function fit() {
    const frame = root.getBoundingClientRect();
    const bottom = menu.hidden ? frame.height : Math.max(frame.height, menu.offsetTop + menu.offsetHeight + 12);
    bridge.resize(Math.ceil(frame.width), Math.ceil(bottom));
  }
  menu.tabIndex = -1;
  menu.addEventListener("keydown", (event) => {
    const items = Array.from(menu.querySelectorAll('[role="option"]'));
    const at = items.findIndex((item) => item.classList.contains("active"));
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      activate(items[(at + (event.key === "ArrowDown" ? 1 : -1) + items.length) % items.length] ?? null);
    } else if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      items[at]?.click();
    } else if (event.key === "Escape") {
      event.preventDefault();
      const anchor = open?.anchor;
      closeMenu();
      anchor?.focus({ preventScroll: true });
    } else if (event.key === "Tab") closeMenu();
  });
  document.addEventListener("click", () => closeMenu());
  window.addEventListener("resize", place);
  function drawLines(lines) {
    const nodes = [];
    for (const [i, line] of lines.entries()) {
      if (i) nodes.push(document.createTextNode("\n"));
      let last = 0;
      for (const match of line.matchAll(/[─-╿]+|\[[^\]\n]{1,40}\]/g)) {
        if (match.index > last) nodes.push(document.createTextNode(line.slice(last, match.index)));
        const text = match[0];
        nodes.push(element("span", text.startsWith("[") ? "control" : "rule", text));
        last = match.index + text.length;
      }
      if (last < line.length) nodes.push(document.createTextNode(line.slice(last)));
    }
    return nodes;
  }
  function showSketch(sketch, key) {
    shownKey = key;
    shownSketch = sketch?.lines.length ? sketch : null;
    preview.classList.remove("stale", "drawing-first");
    if (!sketch?.lines.length) {
      preview.hidden = true;
      fit();
      return;
    }
    preview.hidden = false;
    previewTitle.textContent = sketch.title ? `Preview: ${sketch.title}` : "Preview";
    drawing.replaceChildren(...drawLines(sketch.lines));
    fit();
  }
  function showDrawing() {
    preview.hidden = false;
    preview.classList.add("drawing-first");
    previewTitle.textContent = "Drawing a preview\u2026";
    drawing.replaceChildren(...[78, 92, 64, 85].map((width) => {
      const bar = element("span", "skeleton");
      bar.style.width = `${width}%`;
      return bar;
    }));
  }
  function schedulePreview(delay) {
    if (!card?.preview || sending || sent || stillReading()) return;
    window.clearTimeout(timer);
    const version = ++previewVersion;
    const key = picksKey();
    if (key === "[]" && firstSketch) return showSketch(firstSketch, key);
    if (key === shownKey) {
      preview.classList.remove("stale");
      return;
    }
    if (card.sketchState === "drawing" && key === "[]") return;
    if (!preview.hidden && !preview.classList.contains("drawing-first")) preview.classList.add("stale");
    const cardId = card.id;
    timer = window.setTimeout(async () => {
      try {
        const result = await bridge.sketch({ cardId, picks: { ...picks } });
        if (version !== previewVersion) return;
        if (result?.isError || !result?.structuredContent) throw new Error();
        if (key === "[]") firstSketch = result.structuredContent.sketch;
        showSketch(result.structuredContent.sketch, key);
      } catch {
        if (version === previewVersion) preview.classList.remove("stale");
      }
    }, delay);
  }
  function accept(next) {
    const before = card;
    if (before && (next.version ?? 0) < (before.version ?? 0)) return;
    card = next;
    for (const id of Object.keys(picks)) {
      const row = next.rows.find((row2) => row2.id === id);
      if (!row || picks[id].some((i) => i >= row.options.length)) delete picks[id];
    }
    root.classList.toggle("is-reading", stillReading());
    reading.textContent = next.reading ?? "";
    reading.classList.toggle("skeleton-line", !next.reading && stillReading());
    editor.hidden = false;
    renderPlan();
    if (!next.preview) {
      if (!stillReading()) preview.hidden = true;
    } else if (next.sketchState === "done") {
      firstSketch = next.sketch;
      if (picksKey() === "[]" && shownKey !== "[]") showSketch(next.sketch, "[]");
    } else if (next.sketchState === "drawing" && preview.hidden) showDrawing();
    else if (next.sketchState === "failed" && picksKey() === "[]" && shownKey === null) preview.hidden = true;
    if (before?.state === "reading" && next.state !== "reading" && picksKey() !== "[]") schedulePreview(0);
    fit();
  }
  async function follow() {
    if (following) return;
    following = true;
    let misses = 0;
    while (card && !sent && (card.state === "reading" || card.sketchState === "drawing")) {
      try {
        const result = await bridge.read({ card: card.id, after: card.version ?? 0 });
        if (result?.isError || !result?.structuredContent) throw new Error();
        misses = 0;
        accept(result.structuredContent);
      } catch {
        if (++misses >= 3) {
          if (card.state === "reading") accept({ ...card, state: "failed", version: (card.version ?? 0) + 1 });
          if (card.sketchState === "drawing") accept({ ...card, sketchState: "failed", version: (card.version ?? 0) + 1 });
          break;
        }
        await new Promise((resolve) => setTimeout(resolve, 600 * misses));
      }
    }
    following = false;
  }
  function showOutput(output) {
    if (!output || typeof output !== "object") return;
    if ("isError" in output && output.isError && !card) {
      reading.classList.remove("skeleton-line");
      reading.textContent = "MarginCue could not open this card. Codex will go ahead with your prompt as written.";
      return;
    }
    const data = "structuredContent" in output ? output.structuredContent : output;
    if (typeof data?.id !== "string" || typeof data.prompt !== "string" || !Array.isArray(data.rows)) return;
    if (card && card.id !== data.id) return;
    const saved = bridge.state();
    if (saved?.cardId === data.id && saved.followUp) {
      card = data;
      reading.textContent = data.reading ?? "";
      reading.classList.remove("skeleton-line");
      return showSummary(saved.followUp);
    }
    accept(data);
    void follow();
  }
  function showSummary(message) {
    sent = true;
    closeMenu();
    root.classList.remove("is-reading");
    editor.hidden = true;
    const head = message.decisions.length || message.extra || message.text.includes("Target output") ? "Codex is going ahead with this plan." : "Codex is going ahead with your prompt as written.";
    summary.replaceChildren(element("p", "summary-head", head));
    if (message.decisions.length) {
      const list = element("ul");
      for (const decision of message.decisions) list.append(element("li", void 0, decision));
      summary.append(list);
    }
    if (message.extra) summary.append(element("p", "summary-note", `Your note: ${message.extra}`));
    summary.hidden = false;
    fit();
  }
  async function send(asWrittenOnly) {
    if (sending || sent) return;
    const target = shownKey === picksKey() && !preview.hidden && !preview.classList.contains("stale") ? shownSketch : null;
    const message = composeFollowUp(card?.rows ?? [], picks, note.value, asWrittenOnly, target);
    sending = true;
    closeMenu();
    goButton.disabled = asWritten.disabled = note.disabled = true;
    errorMessage.hidden = true;
    try {
      await bridge.send(message.text);
      window.clearTimeout(timer);
      previewVersion++;
      showSummary(message);
      summary.focus({ preventScroll: true });
      if (card) bridge.saveState({ cardId: card.id, followUp: message });
    } catch (error) {
      errorMessage.textContent = error instanceof Error && error.message ? error.message : "Could not send. Try again, or reply in the thread.";
      errorMessage.hidden = false;
    } finally {
      sending = false;
      goButton.disabled = asWritten.disabled = note.disabled = false;
    }
  }
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    void send(false);
  });
  asWritten.addEventListener("click", () => void send(true));
  note.addEventListener("input", updateActions);
  var bridge = connectWidget(showOutput);
  new ResizeObserver(() => fit()).observe(root);
})();
</script>
