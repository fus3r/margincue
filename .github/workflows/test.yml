name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ripgrep
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
      - name: Core and index
        run: node --test spec/*.unit.ts
      - name: Traces
        run: node spec/run-traces.ts
      - name: Codex bundle matches its sources
        if: runner.os == 'Linux'
        run: |
          cd mods/codex
          npm run build
          git diff --exit-code -- dist
      - name: Codex type-check
        if: runner.os == 'Linux'
        working-directory: mods/codex
        run: |
          npm install --no-save --no-package-lock typescript@5.9.3 @types/node@24.19.4
          node_modules/.bin/tsc -p tsconfig.json
      - name: Claude Code plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin test mods/claude-code

  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Relay unit and terminal tests
        run: cargo test --release --locked --manifest-path crates/margincue-relay/Cargo.toml

  setup:
    # What `npx -y github:fus3r/margincue setup` does, from the packed package, in a fresh home.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Codex CLI
        run: npm install -g @openai/codex && codex --version
      - name: Setup in a fresh home
        run: bash .github/scripts/setup-check.sh
